services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zayqora
      POSTGRES_PASSWORD: zayqora_dev_password
      POSTGRES_DB: zayqora_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zayqora -d zayqora_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://zayqora:zayqora_dev_password@postgres:5432/zayqora_prod
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-production-secret
      S3_BUCKET: zayqora-media-dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://zayqora:zayqora_dev_password@postgres:5432/zayqora_prod
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-production-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
