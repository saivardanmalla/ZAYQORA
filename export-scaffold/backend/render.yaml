services:
  - type: web
    name: zayqora-fastapi-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zayqora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zayqora-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: zayqora-postgres
    plan: starter
